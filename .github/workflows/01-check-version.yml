name: Check Version
on: workflow_call

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Verify if Docker Image already exists
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Versión detectada en pom.xml: $VERSION"
          
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/f1-calendar:$VERSION"
          
          echo "Buscando si existe la imagen: $IMAGE"
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin > /dev/null 2>&1
          
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            echo "::error:: La imagen $IMAGE ya existe en el registro (GHCR). ¡Debes subir la versión en tu pom.xml para continuar!"
            exit 1
          else
            echo "La versión $VERSION está libre."
          fi