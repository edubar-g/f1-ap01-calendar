name: Check Version
on: workflow_call

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Verify if Docker Image already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/f1-calendar:$VERSION"
          
          echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin > /dev/null 2>&1
          
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            echo "::error::Hay que subir la versión del POM"
            exit 1
          fi